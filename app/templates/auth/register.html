{% extends "base.html" %}
{% block title %}Student Registration - Campus Marketplace{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card card-custom p-4 shadow-sm border-0">
        <div class="text-center mb-4">
          <div class="kpi-icon-box bg-teal text-white mx-auto mb-3" style="width: 60px; height: 60px; background-color: var(--secondary-teal);">
            <i class="bi bi-person-badge fs-2"></i>
          </div>
          <h3 class="fw-bold">Student Registration</h3>
          <p class="text-muted small">Create your verified campus identity to buy and sell on campus</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="full_name">Full Name <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Priyam Ashidkar" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold" for="student_id">University Student ID <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. CS2024001" required>
              </div>
              <small class="text-muted">4-20 alphanumeric characters</small>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="email">University Email <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="student@campus.edu" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold" for="phone">Phone / WhatsApp</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+91 9876543210">
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="campus_block">Hostel / Campus Residence Block</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control" id="campus_block" name="campus_block" placeholder="e.g. Hostel H-3, Room 302 or Day Scholar (Sector 5)">
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="password">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 characters" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold" for="confirm_password">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
              </div>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-teal py-2 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Register Student Account
            </button>
          </div>
        </form>

        <div class="text-center text-muted small border-top pt-3">
          Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
