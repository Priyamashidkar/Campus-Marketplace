{% extends "base.html" %}
{% block title %}ERP Admin Login - Campus Marketplace{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card card-custom p-4 shadow-sm border-0 border-top border-4 border-warning">
        <div class="text-center mb-4">
          <div class="kpi-icon-box bg-dark text-warning mx-auto mb-3" style="width: 60px; height: 60px;">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h3 class="fw-bold">ERP Administrative Console</h3>
          <p class="text-muted small">Restricted to authorized campus ERP administrators</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Administrator Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill-lock"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="admin@campus.edu" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" for="password">Administrator Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter master password" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-warning py-2 fw-bold text-dark">
              <i class="bi bi-box-arrow-in-right me-1"></i> Access ERP Control Center
            </button>
          </div>
        </form>

        <div class="text-center text-muted small border-top pt-3 mt-4">
          <a href="{{ url_for('auth.login') }}" class="text-secondary"><i class="bi bi-arrow-left"></i> Return to Student Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
