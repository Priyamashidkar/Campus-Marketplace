{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-lg-4 py-4">
  <div class="row g-4">
    <!-- ERP Sidebar Column -->
    <div class="col-lg-3 col-xl-2">
      <div class="card card-custom p-3 border-0 bg-white shadow-sm sticky-top" style="top: 85px; z-index: 10;">
        <div class="d-flex align-items-center gap-2 mb-3 px-2 pb-2 border-bottom">
          <i class="bi bi-shield-shaded text-warning fs-4"></i>
          <div>
            <strong class="d-block text-navy" style="font-size: 0.95rem;">ERP Management</strong>
            <small class="badge bg-danger-subtle text-danger" style="font-size: 0.7rem;">Admin Console</small>
          </div>
        </div>

        <nav class="nav flex-column erp-sidebar-nav">
          <a class="erp-nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.inventory' %}active{% endif %}" href="{{ url_for('admin.inventory') }}">
            <i class="bi bi-boxes"></i> Inventory
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.orders' %}active{% endif %}" href="{{ url_for('admin.orders') }}">
            <i class="bi bi-cart-check"></i> Orders
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.transactions' %}active{% endif %}" href="{{ url_for('admin.transactions') }}">
            <i class="bi bi-cash-stack"></i> Transactions
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}" href="{{ url_for('admin.users') }}">
            <i class="bi bi-people"></i> Users
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.products' %}active{% endif %}" href="{{ url_for('admin.products') }}">
            <i class="bi bi-tags"></i> Products
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.categories' %}active{% endif %}" href="{{ url_for('admin.categories') }}">
            <i class="bi bi-grid"></i> Categories
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.complaints' %}active{% endif %}" href="{{ url_for('admin.complaints') }}">
            <i class="bi bi-shield-exclamation"></i> Complaints
          </a>
          <a class="erp-nav-link {% if request.endpoint == 'admin.reports' %}active{% endif %}" href="{{ url_for('admin.reports') }}">
            <i class="bi bi-bar-chart-line"></i> Reports & KPIs
          </a>
        </nav>

        <div class="mt-4 pt-3 border-top px-2">
          <small class="text-muted d-block mb-2">Administrator:</small>
          <strong class="text-dark small d-block text-truncate">{{ current_user.full_name }}</strong>
          <span class="badge bg-secondary-subtle text-dark small">{{ current_user.email }}</span>
        </div>
      </div>
    </div>

    <!-- ERP Content Column -->
    <div class="col-lg-9 col-xl-10">
      {% block admin_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
